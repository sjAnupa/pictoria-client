name: Build and Deploy to Ubuntu aaPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy to Ubuntu aaPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 1. Install dependencies
      - name: Install dependencies
        run: npm install

      # 2. Build production React application (CI=false prevents warnings from failing the build)
      - name: Build production React application
        env:
          CI: false
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_R2_PUBLIC_URL: ${{ secrets.VITE_R2_PUBLIC_URL }}
        run: npm run build

      # 3. Setup SSH Key for rsync & ssh
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${SSH_PORT:-22} -H $SERVER_IP >> ~/.ssh/known_hosts

      # 4. Rsync build output directly to aaPanel website directory
      - name: Rsync build output to aaPanel
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          rsync -avz --delete \
            --exclude=.user.ini \
            --exclude=.htaccess \
            --exclude=.well-known \
            -e "ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            dist/ ${SERVER_USER}@${SERVER_IP}:${REMOTE_PATH}/

      # 5. Set aaPanel (Nginx www:www) file permissions
      - name: Set aaPanel file permissions
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} \
            "chattr -i ${REMOTE_PATH}/.user.ini 2>/dev/null || true; chown -R www:www ${REMOTE_PATH} && chmod -R 755 ${REMOTE_PATH}; chattr +i ${REMOTE_PATH}/.user.ini 2>/dev/null || true"
