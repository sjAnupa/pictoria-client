name: Build and Deploy to Ubuntu aaPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy to Ubuntu aaPanel
    runs-on: ubuntu-latest
    env:
      SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER || secrets.VPS_USER || vars.VPS_USER }}
      SERVER_IP: ${{ secrets.SERVER_IP || vars.SERVER_IP || secrets.VPS_HOST || vars.VPS_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || secrets.VPS_PORT || vars.VPS_PORT || '22' }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH || vars.REMOTE_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 1. Install dependencies
      - name: Install dependencies
        run: npm install

      # 2. Build production React application (CI=false prevents warnings from failing the build)
      - name: Build production React application
        env:
          CI: false
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_R2_PUBLIC_URL: ${{ secrets.VITE_R2_PUBLIC_URL || vars.VITE_R2_PUBLIC_URL }}
        run: npm run build

      # 3. Setup SSH Key for rsync & ssh
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || vars.SSH_PRIVATE_KEY || vars.VPS_SSH_KEY }}
        run: |
          if [ -z "$SERVER_IP" ]; then
            echo "Error: SERVER_IP (or VPS_HOST) is missing in GitHub Repository Secrets or Variables." >&2
            exit 1
          fi
          if [ -z "$SERVER_USER" ]; then
            echo "Error: SERVER_USER (or VPS_USER) is missing in GitHub Repository Secrets or Variables." >&2
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Error: SSH_PRIVATE_KEY (or VPS_SSH_KEY) is missing in GitHub Repository Secrets." >&2
            exit 1
          fi
          if [ -z "$REMOTE_PATH" ]; then
            echo "Error: REMOTE_PATH is missing in GitHub Repository Secrets or Variables." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SERVER_IP" >> ~/.ssh/known_hosts

      # 4. Rsync build output directly to aaPanel website directory
      - name: Rsync build output to aaPanel
        run: |
          rsync -avz --delete \
            --exclude=.user.ini \
            --exclude=.htaccess \
            --exclude=.well-known \
            -e "ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            dist/ "${SERVER_USER}@${SERVER_IP}:${REMOTE_PATH}/"

      # 5. Set aaPanel (Nginx www:www) file permissions
      - name: Set aaPanel file permissions
        run: |
          ssh -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no "${SERVER_USER}@${SERVER_IP}" \
            "chattr -i '${REMOTE_PATH}/.user.ini' 2>/dev/null || true; chown -R www:www '${REMOTE_PATH}' && chmod -R 755 '${REMOTE_PATH}'; chattr +i '${REMOTE_PATH}/.user.ini' 2>/dev/null || true"
